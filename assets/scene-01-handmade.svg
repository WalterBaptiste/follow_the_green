<svg xmlns="http://www.w3.org/2000/svg" width="160" height="200" viewBox="0 0 160 200" shape-rendering="crispEdges">
  <defs>
    <pattern id="wall-dither" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#626b65"/>
      <rect width="2" height="2" fill="#727a70"/>
      <rect x="2" y="2" width="2" height="2" fill="#515b56"/>
    </pattern>
    <pattern id="water-dither" width="8" height="4" patternUnits="userSpaceOnUse">
      <rect width="8" height="4" fill="#14251f"/>
      <rect x="0" y="1" width="4" height="1" fill="#314b3d"/>
      <rect x="5" y="3" width="3" height="1" fill="#23392f"/>
    </pattern>
  </defs>

  <!-- 16-colour base palette; every shape is aligned to the native 160×200 grid. -->
  <rect width="160" height="200" fill="#08100d"/>

  <!-- Flat morning sky and distant blocky skyline. -->
  <rect x="0" y="0" width="160" height="41" fill="#c5c6a8"/>
  <rect x="0" y="28" width="160" height="13" fill="#a3aa91"/>
  <rect x="13" y="20" width="15" height="21" fill="#6f7c73"/>
  <rect x="17" y="16" width="5" height="4" fill="#6f7c73"/>
  <rect x="31" y="24" width="21" height="17" fill="#596860"/>
  <rect x="36" y="18" width="11" height="6" fill="#596860"/>
  <rect x="112" y="14" width="17" height="27" fill="#64716a"/>
  <rect x="116" y="20" width="3" height="4" fill="#c5c6a8"/>
  <rect x="123" y="28" width="3" height="4" fill="#c5c6a8"/>
  <rect x="133" y="21" width="27" height="20" fill="#53615a"/>

  <!-- Broken roof beam. -->
  <rect x="0" y="0" width="160" height="7" fill="#101814"/>
  <rect x="0" y="7" width="39" height="6" fill="#17231d"/>
  <rect x="58" y="7" width="61" height="4" fill="#17231d"/>
  <rect x="137" y="7" width="23" height="7" fill="#17231d"/>
  <rect x="43" y="7" width="5" height="15" fill="#25352b"/>
  <rect x="121" y="7" width="4" height="13" fill="#25352b"/>

  <!-- Left concrete volume. -->
  <polygon points="0,13 59,27 57,132 0,163" fill="url(#wall-dither)"/>
  <polygon points="0,13 59,27 59,34 0,22" fill="#7f867b"/>
  <rect x="0" y="117" width="57" height="8" fill="#424e48"/>
  <rect x="0" y="125" width="54" height="4" fill="#2a3831"/>
  <rect x="4" y="34" width="47" height="70" fill="#37453f"/>

  <!-- Glass-block grid, deliberately repetitive like a tileset. -->
  <g fill="#7e8d80">
    <rect x="6" y="37" width="8" height="9"/><rect x="16" y="37" width="8" height="9"/><rect x="26" y="37" width="8" height="9"/><rect x="36" y="37" width="8" height="9"/>
    <rect x="6" y="48" width="8" height="9"/><rect x="16" y="48" width="8" height="9"/><rect x="26" y="48" width="8" height="9"/><rect x="36" y="48" width="8" height="9"/>
    <rect x="6" y="59" width="8" height="9"/><rect x="16" y="59" width="8" height="9"/><rect x="36" y="59" width="8" height="9"/>
    <rect x="6" y="70" width="8" height="9"/><rect x="16" y="70" width="8" height="9"/><rect x="26" y="70" width="8" height="9"/><rect x="36" y="70" width="8" height="9"/>
    <rect x="6" y="81" width="8" height="9"/><rect x="16" y="81" width="8" height="9"/><rect x="26" y="81" width="8" height="9"/><rect x="36" y="81" width="8" height="9"/>
    <rect x="6" y="92" width="8" height="9"/><rect x="16" y="92" width="8" height="9"/><rect x="26" y="92" width="8" height="9"/><rect x="36" y="92" width="8" height="9"/>
  </g>
  <g fill="#a6ab95">
    <rect x="7" y="38" width="5" height="2"/><rect x="17" y="49" width="5" height="2"/><rect x="27" y="38" width="5" height="2"/><rect x="37" y="71" width="5" height="2"/>
    <rect x="7" y="82" width="5" height="2"/><rect x="27" y="93" width="5" height="2"/><rect x="37" y="93" width="5" height="2"/>
  </g>
  <rect x="27" y="59" width="7" height="9" fill="#101814"/>
  <rect x="25" y="61" width="2" height="5" fill="#101814"/>

  <!-- Central arch and far passage. -->
  <polygon points="52,28 107,29 111,138 96,147 58,145 50,130" fill="#48554f"/>
  <rect x="57" y="34" width="45" height="105" fill="#17231d"/>
  <rect x="62" y="42" width="35" height="97" fill="#0b1411"/>
  <polygon points="62,42 97,42 97,54 92,48 87,44 71,44 66,49 62,57" fill="#35443b"/>
  <rect x="69" y="78" width="23" height="61" fill="#1d2c25"/>
  <rect x="73" y="86" width="15" height="53" fill="#31463a"/>
  <rect x="77" y="91" width="7" height="48" fill="#6f7f68"/>
  <rect x="78" y="94" width="5" height="45" fill="#9ba283"/>
  <rect x="83" y="103" width="5" height="36" fill="#4c654d"/>

  <!-- Right concrete wall and drain pipe. -->
  <polygon points="105,21 160,10 160,158 102,135" fill="#59635e"/>
  <polygon points="105,21 160,10 160,20 105,29" fill="#777e73"/>
  <rect x="111" y="31" width="49" height="6" fill="#414d47"/>
  <rect x="107" y="78" width="53" height="5" fill="#303c36"/>
  <rect x="128" y="19" width="7" height="77" fill="#725444"/>
  <rect x="130" y="19" width="3" height="77" fill="#a07053"/>
  <rect x="123" y="91" width="12" height="7" fill="#725444"/>
  <rect x="120" y="94" width="6" height="22" fill="#725444"/>
  <rect x="122" y="95" width="2" height="21" fill="#a07053"/>
  <g fill="#2b302d">
    <rect x="126" y="29" width="11" height="3"/><rect x="126" y="57" width="11" height="3"/><rect x="118" y="103" width="10" height="3"/>
  </g>

  <!-- Vines are chunky, sparse and hand-placed. -->
  <g fill="#294b31">
    <rect x="18" y="7" width="4" height="24"/><rect x="14" y="15" width="5" height="4"/><rect x="21" y="22" width="7" height="4"/>
    <rect x="47" y="20" width="4" height="36"/><rect x="42" y="28" width="7" height="4"/><rect x="50" y="38" width="7" height="5"/>
    <rect x="101" y="12" width="4" height="35"/><rect x="96" y="22" width="6" height="4"/><rect x="105" y="31" width="7" height="4"/>
    <rect x="148" y="17" width="4" height="44"/><rect x="143" y="28" width="8" height="4"/><rect x="151" y="41" width="7" height="5"/>
  </g>
  <g fill="#4f7444">
    <rect x="15" y="9" width="5" height="5"/><rect x="23" y="26" width="6" height="5"/><rect x="43" y="23" width="6" height="4"/>
    <rect x="51" y="44" width="6" height="5"/><rect x="97" y="14" width="6" height="5"/><rect x="104" y="37" width="7" height="5"/>
    <rect x="144" y="19" width="7" height="5"/><rect x="151" y="49" width="7" height="5"/>
  </g>
  <g fill="#26fd75">
    <rect x="23" y="27" width="3" height="3"/><rect x="103" y="37" width="3" height="3"/><rect x="149" y="50" width="3" height="3"/>
  </g>

  <!-- Flooded floor. -->
  <rect x="0" y="137" width="160" height="63" fill="url(#water-dither)"/>
  <rect x="0" y="143" width="68" height="2" fill="#566c55"/>
  <rect x="12" y="151" width="42" height="2" fill="#2f5b3b"/>
  <rect x="3" y="165" width="57" height="2" fill="#536c51"/>
  <rect x="18" y="181" width="44" height="2" fill="#284a35"/>
  <rect x="72" y="154" width="28" height="2" fill="#66806a"/>
  <rect x="78" y="176" width="38" height="2" fill="#385744"/>
  <rect x="11" y="189" width="29" height="2" fill="#6e8068"/>

  <!-- Walkway: simple repeated slabs, no perspective smoothing. -->
  <polygon points="69,132 98,132 151,200 24,200" fill="#303c37"/>
  <polygon points="68,136 99,136 105,143 62,143" fill="#8b8e80"/>
  <polygon points="61,146 108,146 115,154 53,154" fill="#6f766d"/>
  <polygon points="52,158 119,158 128,168 42,168" fill="#929286"/>
  <polygon points="41,173 132,173 143,185 29,185" fill="#676f68"/>
  <polygon points="27,189 146,189 156,200 14,200" fill="#8a8b80"/>
  <g fill="#38463f">
    <rect x="71" y="140" width="15" height="2"/><rect x="59" y="151" width="18" height="2"/><rect x="92" y="163" width="21" height="2"/>
    <rect x="49" y="180" width="24" height="2"/><rect x="104" y="195" width="27" height="2"/>
  </g>

  <!-- Foreground ferns made from square clusters. -->
  <g fill="#1f402b">
    <rect x="0" y="151" width="7" height="49"/><rect x="6" y="157" width="15" height="5"/><rect x="4" y="168" width="21" height="5"/>
    <rect x="7" y="181" width="17" height="5"/><rect x="145" y="116" width="7" height="84"/><rect x="132" y="126" width="18" height="5"/>
    <rect x="127" y="139" width="22" height="5"/><rect x="136" y="151" width="24" height="5"/>
  </g>
  <g fill="#4e7447">
    <rect x="7" y="153" width="16" height="4"/><rect x="2" y="164" width="16" height="4"/><rect x="10" y="175" width="17" height="4"/>
    <rect x="131" y="121" width="18" height="4"/><rect x="137" y="132" width="20" height="4"/><rect x="126" y="146" width="20" height="4"/>
  </g>

  <!-- The clickable satchel is painted into the scene, not overlaid as a sticker. -->
  <rect x="117" y="151" width="26" height="17" fill="#332c25"/>
  <rect x="120" y="148" width="20" height="5" fill="#614c38"/>
  <polygon points="117,151 143,151 139,158 121,158" fill="#72553b"/>
  <rect x="121" y="158" width="18" height="9" fill="#4d3d30"/>
  <rect x="117" y="164" width="4" height="12" fill="#332c25"/>
  <rect x="139" y="164" width="4" height="12" fill="#332c25"/>
  <rect x="128" y="157" width="4" height="4" fill="#151b17"/>
  <rect x="129" y="158" width="3" height="3" fill="#26fd75"/>
  <rect x="121" y="151" width="2" height="2" fill="#a07053"/>
  <rect x="137" y="151" width="2" height="2" fill="#a07053"/>

  <!-- Sparse acid-green reflections: narrative thread, not a global filter. -->
  <rect x="129" y="181" width="12" height="2" fill="#26fd75"/>
  <rect x="133" y="185" width="5" height="1" fill="#26fd75"/>
  <rect x="31" y="171" width="8" height="1" fill="#26fd75"/>
</svg>
